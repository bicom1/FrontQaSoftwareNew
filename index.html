<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!-- Favicon: inline SVG shield + checkmark, representing Quality Control -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2 L58 12 V30 C58 46 47 58 32 62 C17 58 6 46 6 30 V12 Z' fill='%230D6EFD'/%3E%3Cpath d='M20 32 L28 40 L45 22' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Apple Devices: same icon, rounded automatically by iOS -->
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D6EFD'/%3E%3Cpath d='M20 32 L28 40 L45 22' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Browser Theme -->
    <meta name="theme-color" content="#0D6EFD" />
    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>QC Software</title>
    <meta
      name="description"
      content="QC Software - Quality Control Management System"
    />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Rounded logo styling: applies wherever an <img> uses the "logo" class -->
    <style>
      .logo {
        border-radius: 50%;       /* fully circular */
        object-fit: cover;
        width: 48px;
        height: 48px;
        overflow: hidden;
      }

      /* Use this variant instead if you want a rounded square rather than a circle */
      .logo-rounded-square {
        border-radius: 12px;
        object-fit: cover;
        width: 48px;
        height: 48px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
